[package]
name = "spill"
version = "0.5.0"
edition = "2024"
publish = ["crates-io"]
description = "A single-user BitTorrent daemon for Linux and macOS"
license = "Apache-2.0"
repository = "https://github.com/spillrs/spill"
readme = "README.md"
keywords = ["bittorrent", "torrent", "daemon"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "src/**",
    "tests/**",
    "deploy/**",
    "docs/**",
]

[[bin]]
name = "spill"
path = "src/daemon/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
sha1 = "0.11"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
# Optional-to-observe structured diagnostics; no subscriber, payload or endpoint logging.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# OS entropy for peer IDs/transactions; std retains error sources (MIT/Apache-2.0).
getrandom = { version = "0.2", features = ["std"] }
# Established URL syntax/host parser; no resolver or HTTP client (MIT/Apache-2.0).
url = "2.5.8"
# One dual-stack session UDP socket for tracker exchanges.
socket2 = "0.6"
# HTTP/1 + rustls/ring with bundled Mozilla roots; no system TLS, proxies or compression.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["process"] }

[target.'cfg(unix)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# Platform errno constants only; no unsafe syscall wrappers.
libc = "0.2"
# Safe descriptor-relative filesystem operations and advisory locks.
rustix = { version = "1.1", features = ["fs", "process"] }
serde_json = "1"
toml = "0.8"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
