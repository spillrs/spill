[workspace]
members = [
    "crates/protocol",
    "crates/engine",
    "crates/daemon",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
engine = { path = "crates/engine" }
sha1 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
